baseURL: "https://blog.inital.top/"
languageCode: "zh-cn"
title: "~ iNITAL_'s Blog ~"
theme: "PaperMod"

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
        enable: true
  highlight:
    noClasses: false

params:
  homeInfoParams:
    Title: "iNITAL_'s Blog (^_^)"
    Content: "
      在这里，你可以看到：\n
      - ACGN相关内容，个人的游戏以及动漫库。\n
      - 技术相关内容，个人瞎折腾各种东西的记录。\n
      - 生活相关内容。\n
      - [更多……](/about/)"

  socialIcons:
    - name: "github"
      url: "https://github.com/InitalUpotia"
    - name: "email"
      url: "mailto:python_zzy@qq.com"
    - name: "bilibili"
      url: "https://space.bilibili.com/1589490577"


  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true


  defaultTheme: auto
  UseHugoToc: true
  
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  tocopen: false
  math: true

  # giscus:
  #   repo: "InitalUpotia/blog-comments"
