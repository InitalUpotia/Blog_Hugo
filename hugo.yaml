baseURL: "https://blog.inital.top/"
languageCode: "zh-cn"
title: "~ iNITAL_'s Blog ~"
theme: "PaperMod"

module:
  imports:
    - path: github.com/hugomods/shortcodes

markup:
  goldmark:
    extensions:
      strikethrough: false
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
        
      extras:
        mark:
          enable: true
        insert:
          enable: true          # ++插入文本++
        subscript:
          enable: true          # ~下标~
        superscript:
          enable: true          # ^上标^
        delete:
          enable: true
  highlight:
    noClasses: false

params:
  homeInfoParams:
    Title: "iNITAL_'s Blog (^_^)"
    Content: "
      在这里，你可以看到：\n
      - ACGN相关内容，个人的游戏以及动漫库。\n
      - 技术相关内容，个人瞎折腾各种东西的记录。\n
      - 生活相关内容。\n
      - [更多……](/about/)"

  socialIcons:
    - name: "github"
      url: "https://github.com/InitalUpotia"
    - name: "email"
      url: "mailto:python_zzy@qq.com"
    - name: "bilibili"
      url: "https://space.bilibili.com/1589490577"


  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true


  defaultTheme: auto
  UseHugoToc: true
  
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  tocopen: false
  math: true

menu:
  main:
    - name: 文章
      url: /posts/
      weight: 1
    - identifier: categories
      name: 归档
      url: /categories/
      weight: 2
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 3
    - name: 关于
      url: /about/
      weight: 4
    - identifier: example
      name: 友链
      url: https://initalupotia.github.io/
      weight: 5


outputs:
  home:
    - HTML
    - RSS
    - JSON