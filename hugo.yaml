  #   theme: "preferred_color_scheme"
  #   lang: "zh-CN"

menu:
  main:
    - name: 文章
      url: /posts/
      weight: 1
    - identifier: categories
      name: 归档
      url: /categories/
      weight: 2
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 3
    - name: 关于
      url: /about/
      weight: 4
    - identifier: example
      name: 友链
      url: https://initalupotia.github.io/
      weight: 5


outputs:
  home:
    - HTML
    - RSS
    - JSON