baseURL: "https://blog.inital.top/"
locale: "zh-cn"
hasCJKLanguage: true
title: "~ iNITAL_'s Blog ~"
theme: "PaperMod"

taxonomies:
  category: columns   # 👈 把 categories 改名为 columns
  tag: tags

module:
  imports:
    - path: github.com/hugomods/shortcodes

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false   # 图片注释
    extensions:
      strikethrough: false
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
        
      extras:
        mark:
          enable: true
        insert:
          enable: true          # ++插入文本++
        subscript:
          enable: true          # ~下标~
        superscript:
          enable: true          # ^上标^
        delete:
          enable: true
  highlight:
    noClasses: false

params:
  homeInfoParams:
    Title: "iNITAL_'s Blog (\\^_\\^)"
    Content: "
      在这里，你可以看到：\n
      - ACGN相关内容，个人的游戏以及动漫库。\n
      - 技术相关内容，个人瞎折腾各种东西的记录。\n
      - 生活相关内容。\n
      - [更多……](/about/)"

  label:
    text: "Home"                # 鼠标悬停时显示的文字
    icon: "/logo.jpg"    # 图片路径，以 / 开头
    iconHeight: 35              # 图标高度（像素），按需调整
  socialIcons:
    - name: "github"
      url: "https://github.com/InitalUpotia"
    - name: "email"
      url: "mailto:python_zzy@qq.com"
    - name: "bilibili"
      url: "https://space.bilibili.com/1589490577"


  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: true
  ShowWordCount: true
  ShowToc: true
  ShowRssButtonInSectionTermList: true

  defaultTheme: auto
  UseHugoToc: true
  
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  tocopen: false
  math: true

menu:
  main:
    - name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: columns
      name: 专栏
      url: /columns/
      weight: 30
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 40
    - name: 搜索
      url: /search/
      weight: 50
    - name: 关于
      url: /about/
      weight: 60
    - identifier: links
      name: 另我空间
      weight: 71
    - identifier: link-a
      name: 梦的原点
      url: https://initalupotia.github.io/
      weight: 72
      parent: links
    - identifier: link-b
      name: 未麻的部屋
      url: https://initalupotia.github.io/my-ai-blog/
      weight: 73
      parent: links


outputs:
  home:
    - HTML
    - RSS
    - JSON   # 如果你之前为了搜索启用了 JSON，可以保留
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
    - RSS
  term:
    - HTML
    - RSS