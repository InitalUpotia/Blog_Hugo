{{- $commentPath := partial "comment-path.html" . -}}
{{- $walineLang := cond (eq .Lang "zh") "zh-CN" "en-US" -}}
{{- $walineLoading := i18n "custom_waline_loading" -}}
{{- $walineError := i18n "custom_waline_error" -}}
<div id="waline" class="waline-wrap">
  <div class="waline-loading">{{ $walineLoading }}</div>
</div>

<script type="module">
(function () {
  var el = document.getElementById('waline');
  if (!el) return;

  var CSS_URL = 'https://unpkg.com/@waline/client@3.16.2/dist/waline.css';
  var JS_URL = 'https://unpkg.com/@waline/client@3.16.2/dist/waline.js';
  var started = false;

  function load() {
    if (started) return;
    started = true;

    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = CSS_URL;
    document.head.appendChild(link);

    import(JS_URL).then(function (mod) {
      el.innerHTML = '';
      mod.init({
        el: '#waline',
        serverURL: 'https://waline.inital.top',
        path: '{{ $commentPath }}',
        lang: '{{ $walineLang }}',
        dark: 'html[data-theme="dark"]',

        login: 'enable',
        meta: ['nick', 'mail', 'link'],
        requiredMeta: ['nick'],

        reaction: false,
        imageUploader: false,
        pageview: false,   // 阅读量由 pageview.js 负责，避免重复
        comment: false
      });
    }).catch(function (e) {
      console.error('Waline load failed', e);
      el.textContent = '{{ $walineError }}';
    });
  }

  // 距离评论区 600px 时开始加载
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries, obs) {
      if (entries.some(function (e) { return e.isIntersecting; })) {
        obs.disconnect();
        load();
      }
    }, { rootMargin: '600px' });
    io.observe(el);
  } else {
    load();
  }
})();
</script>
