{{- if not (.Param "hideFooter") }}
{{/*
  PaperMod 先输出 <footer class="footer">，再调用 extend_footer。
  这里不再新建 footer，而是把统计内容注入到已有的 footer 里，
  避免页面上出现两个并排的玻璃卡片。
*/}}
<template id="footer-extra">
    <div class="footer-extra">
        总访客数 <span id="site-uv">—</span> 人 · 总访问量 <span id="site-pv">—</span> 次<br>
        本站已运行 <span id="run-time-detail">计算中...</span>
    </div>
</template>

<script>
  (function () {
    var footer = document.querySelector('.footer');
    var tpl = document.getElementById('footer-extra');
    if (footer && tpl) {
      footer.appendChild(tpl.content.cloneNode(true));
    }
  })();
</script>

<script>
  (function () {
    // 建站日期
    var startDate = new Date("2026-10-19T00:08:00");
    var currentDate = new Date();

    var detail = document.getElementById("run-time-detail");
    if (!detail) return;

    if (currentDate < startDate) {
      detail.textContent = "0 天";
      return;
    }

    var years = currentDate.getFullYear() - startDate.getFullYear();
    var months = currentDate.getMonth() - startDate.getMonth();
    var days = currentDate.getDate() - startDate.getDate();

    if (days < 0) {
      months--;
      var lastMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0);
      days += lastMonth.getDate();
    }
    if (months < 0) {
      years--;
      months += 12;
    }

    var result = "";
    if (years > 0) result += years + " 年 ";
    if (months > 0) result += months + " 个月 ";
    result += days + " 天";

    detail.textContent = result;
  })();
</script>

<script>
(function () {
  // 只在正式域名统计，本地/预览不污染线上数据
  if (location.hostname !== 'blog.inital.top') return;

  var pv = document.getElementById('site-pv');
  var uv = document.getElementById('site-uv');
  if (!pv && !uv) return;

  fetch('https://stats.inital.top/api/hit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: location.pathname })
  })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (d) {
      if (pv) pv.textContent = d.site_pv;
      if (uv) uv.textContent = d.site_uv;
    })
    .catch(function () {
      // 失败保持 —，不显示旧数字
    });
})();
</script>
{{- end }}
