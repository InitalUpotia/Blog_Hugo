{{- $bgClose := i18n "custom_bg_close" -}}
{{- $bgCurrent := i18n "custom_bg_current" -}}
{{- $bgHint := i18n "custom_bg_hint" -}}
{{- $bgChanging := i18n "custom_bg_changing" -}}
{{- $bgChange := i18n "custom_bg_change" -}}
{{- $bgFailed := i18n "custom_bg_failed" -}}
<div id="bg-viewer" class="bg-viewer" role="dialog" aria-modal="true"
     aria-label="{{ $bgClose }}" aria-hidden="true" tabindex="-1">
  <div class="bg-viewer-image" role="img" aria-label="{{ $bgCurrent }}"></div>
  <div class="bg-viewer-hint" aria-hidden="true">{{ $bgHint }}</div>
</div>

<script>
(function () {
  var btn = document.getElementById('bg-view-toggle');
  var viewer = document.getElementById('bg-viewer');
  if (!btn || !viewer) return;

  var hint = viewer.querySelector('.bg-viewer-hint');
  var changeBtn = document.getElementById('bg-change-toggle');
  var changeTitleTimer = null;

  if (changeBtn) {
    if (typeof window.changeBlogBackground !== 'function' || typeof window.fetch !== 'function') {
      changeBtn.hidden = true;
    } else {
      changeBtn.hidden = false;

      changeBtn.addEventListener('click', function () {
        if (changeBtn.disabled) return;

        changeBtn.disabled = true;
        changeBtn.classList.add('is-loading');
        changeBtn.setAttribute('aria-busy', 'true');
        changeBtn.title = '{{ $bgChanging }}';

        if (changeTitleTimer) clearTimeout(changeTitleTimer);

        function done(ok) {
          changeBtn.disabled = false;
          changeBtn.classList.remove('is-loading');
          changeBtn.removeAttribute('aria-busy');
          changeBtn.title = ok ? '{{ $bgChange }}' : '{{ $bgFailed }}';

          if (!ok) {
            changeTitleTimer = setTimeout(function () {
              changeBtn.title = '{{ $bgChange }}';
            }, 2000);
          }
        }

        var task = null;
        try {
          task = window.changeBlogBackground();
        } catch (e) {}

        if (!task || typeof task.then !== 'function') {
          done(false);
          return;
        }

        task.then(function (url) {
          done(!!url);
        }, function () {
          done(false);
        });
      });
    }
  }

  function hasBg() {
    var value = getComputedStyle(document.documentElement)
      .getPropertyValue('--bg-image')
      .trim();
    return value && value !== 'none';
  }

  function updateButton() {
    var has = hasBg();
    btn.hidden = !has;
    btn.disabled = !has;
  }

  function isOpen() {
    return viewer.classList.contains('is-open');
  }

  function open() {
    if (!hasBg() || isOpen()) return;

    viewer.classList.add('is-open');
    viewer.setAttribute('aria-hidden', 'false');
    document.body.classList.add('bg-viewer-open');
    btn.setAttribute('aria-expanded', 'true');
    viewer.focus();

    // 让提示动画每次打开都重播
    if (hint) {
      hint.style.animation = 'none';
      void hint.offsetWidth;
      hint.style.animation = '';
    }
  }

  function close() {
    if (!isOpen()) return;

    viewer.classList.remove('is-open');
    viewer.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('bg-viewer-open');
    btn.setAttribute('aria-expanded', 'false');
    btn.focus();
  }

  btn.addEventListener('click', open);
  viewer.addEventListener('click', close);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isOpen()) close();
  });

  updateButton();

  new MutationObserver(updateButton).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['style']
  });

  window.addEventListener('load', updateButton);
})();
</script>
